# A package's own `name` may not be a built-in package's either: `import std.io;` in it would name
# its own module `src/io.stv`, and as a dependency its modules would be spelled like the built-in's
# (`runtime.x` below).
name = "std" #~ ERROR E1002
kind = "bin"

[dependencies]
rt2 = { path = "dep" }
