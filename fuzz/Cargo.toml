# cargo-fuzz targets for the stave-syntax public API. Not a member of the root
# workspace: it is its own workspace (the `[workspace]` table below), as cargo-fuzz expects.
#   cargo +nightly fuzz run lex -- -max_total_time=600
#   cargo +nightly fuzz run parse -- -max_total_time=600
#   cargo +nightly fuzz run check -- -max_total_time=600   (semantic front end + lowering)
[package]
name = "stave-fuzz"
description = "cargo-fuzz targets for the Stave front end"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stave-lang/stave"
homepage = "https://stave-lang.org"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
stave-diag = { path = "../crates/stave-diag" }
stave-syntax = { path = "../crates/stave-syntax" }
stave-sema = { path = "../crates/stave-sema" }
stave-borrow = { path = "../crates/stave-borrow" }
stave-ir = { path = "../crates/stave-ir" }

[workspace]
members = ["."]

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false
