# stage1: the Stave compiler written in Stave, built by stage0. Its modules are every file under
# `src/`, the generated tables in `src/generated/` included (from contracts/ by the `gen` step).
name = "stage1"
kind = "bin"

# The bulk operations of every pass (module map: `prims`); a data-parallel package replaces this
# one under the same name. `ir`: the type table and the checked IR (model, text, verifier), a
# package of its own so the back end and the prover import it without the front end.
[dependencies]
ir = { path = "ir" }
prims = { path = "prims/seq" }
