rule = "a lock acquired against rank order: while a guard of rank r may be held, a call acquires a lock of rank r or lower (`Mutex.lock`, `Once.get_or_init`, `lock_pair`, directly or through what it can call, fn values and `Once` inits included); checked per instance after the type and borrow checks pass; names the held and the acquired type and the call chain; inside `std` (`with_lock`, a `Once` init) at the user call that leads there; case `drop`: a value whose drop glue acquires such a lock is dropped (scope end, temporary, overwritten old value) while the guard is held"
holes = { fn = "path", lock = "type", rank = "int", held = "type", held_rank = "int" }
message = "`{fn}` acquires `{lock}` (rank {rank}) while it holds `{held}` (rank {held_rank}): locks are taken in increasing rank order"
labels = [{ at = "primary", text = "acquires rank {rank} here" }, { at = "held", text = "`{held}` held from here" }, { at = "call", text = "call on the way" }, { at = "drop", text = "drop on the way" }]
fix = { description = "release the guard before this call, give `{lock}` a rank above {held_rank}, or take two mutexes of one rank together with `sync.lock_pair`" }

[diag.cases.drop]
message = "`{fn}` drops a value whose drop acquires `{lock}` (rank {rank}) while it holds `{held}` (rank {held_rank})"
labels = [{ at = "primary", text = "dropped here" }, { at = "held", text = "`{held}` held from here" }, { at = "call", text = "call on the way" }, { at = "drop", text = "drop on the way" }]
fix = { description = "release the guard before the value is dropped (declare the value before the guard, or end the guard's block first), or give `{lock}` a rank above {held_rank}" }

[[diag]]
code = "E1406"
severity = "error"
area = "effects"
rule = "a guard held across a join whose children acquire a lock at or below its rank: at a `scope` end, `thread.join`, or `par_for` / `par_for_mut` call, the ranks held must be below every rank the joined threads may acquire; names the held and the acquired type and the chain"
holes = { fn = "path", lock = "type", rank = "int", held = "type", held_rank = "int" }
message = "`{fn}` waits for threads that acquire `{lock}` (rank {rank}) while it holds `{held}` (rank {held_rank})"
labels = [{ at = "primary", text = "threads joined here" }, { at = "held", text = "`{held}` held from here" }, { at = "call", text = "call on the way" }, { at = "drop", text = "drop on the way" }]
fix = { description = "release the guard before the join, or give `{lock}` a rank above {held_rank}" }

[[diag]]
code = "E1407"
severity = "error"
area = "effects"
rule = "`Flat` demanded by a bound, type not `Flat`: names the first non-flat component and its path (field chain); case `self` when the type itself is the component; case `depth` past the check's depth cutoff"
holes = { type = "type", path = "place", part = "type", reason = "text-literal", limit = "int" }
choices = { reason = ["a reference", "a raw pointer", "a fn value", "a view type", "`UnsafeCell` (interior mutability)", "a type with `Drop`", "a generic parameter without a `Flat` bound", "unsized"] }
message = "`{type}` is not `Flat`: component `{path}` has type `{part}`, {reason}"
labels = [{ at = "primary", text = "`Flat` required here" }, { at = "param", text = "the `Flat` bound is on this parameter" }]
fix = { description = "pass a type without references, views, raw pointers, fn values, `UnsafeCell`, or `Drop` types; store indices or offsets instead of pointers" }

[diag.cases.self]
message = "`{type}` is not `Flat`: it is {reason}"

[diag.cases.depth]
message = "`{type}` is not `Flat`: it nests deeper than {limit} levels, the limit of the `Flat` check"
fix = { description = "nest the type less deeply" }

[[diag]]
code = "E1408"
severity = "error"
area = "effects"
rule = "an `impl Flat` (safe or `unsafe(..)`): `Flat` is derived by the compiler from the type's structure and never implemented"
holes = { type = "type" }
message = "`impl Flat for {type}`: `Flat` is derived by the compiler, never implemented"
labels = [{ at = "primary", text = "remove this impl" }]
fix = { description = "remove the impl: a type is `Flat` exactly when it holds no reference, view, raw pointer, fn value, `UnsafeCell`, or `Drop` type" }

[[diag]]
code = "E1409"
severity = "error"
area = "effects"
rule = "a call cycle through a closure literal (also when the closure is reached through a fn value); one per cycle, at its first closure literal; the cycle is listed from there along a shortest path"
holes = { name = "path", cycle = "path" }
message = "recursive call cycle `{cycle}` goes through a closure literal in `{name}`"
labels = [{ at = "primary", text = "this closure literal is part of the cycle" }, { at = "call", text = "next call of the cycle" }]
fix = { description = "write the recursive part as a `rec fn` item and call it from the closure" }
