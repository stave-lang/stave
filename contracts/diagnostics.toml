# Stave diagnostic registry, machine-readable source (v0.2)
#
# The registry is the union of three human tables: diagnostic-codes.md (E00xx-E10xx, E13xx),
# gpu-diagnostics.md (E11xx, GPU kernels), and gpu-program-diagnostics.md (E12xx, `gpu-sm86`). They
# hold the rule text; this file holds one entry per code of that union, with its templates.
# tools/diaggen reads it and generates crates/stave-diag/src/generated/templates.rs (stage0) and
# stage1/src/generated/diag_templates.stv (stage1). diaggen fails if:
#   - a code of diagnostic-codes.md, gpu-diagnostics.md (E11xx) or gpu-program-diagnostics.md
#     (E12xx), retired ones included, has no entry here, or an entry has no row there, or a code
#     appears twice, or the entries are not sorted by code;
#   - an error entry lacks `message` or `fix`;
#   - a fix states an `applicability` outside the three values, or a fix without edits states
#     one other than "placeholder";
#   - a template uses a hole not declared in `holes`, or a declared hole is unused by the entry
#     and all its cases together;
#   - a hole kind is not one of the kinds below, or a `text-literal` hole has no `choices`.
#
# Entry format, one [[diag]] table per code, sorted by code:
#   code      "E0000"                               required
#   severity  "error" | "warning"                   required
#   area      range name of diagnostic-codes.md: "lex-parse" "resolve" "types" "patterns" "kinds"
#             "borrow" "simd" "features" "threads-unsafe-ffi" "generics" "driver" "gpu-kernel"
#             "gpu-program" "gpu-compiler" "effects"
#   rule      one line, same meaning as the diagnostic-codes.md row
#   retired   true for a retired code (then only code, rule, retired)
#   located   false for codes with no primary span (they sort first); default true. Exactly
#             E1001, E1301, E1302, E1303 are location-less
#   holes     { name = kind }. Kinds (all canonical, identical in both compilers):
#               name        an identifier as written
#               path        a dotted module/item path (checked-IR Path)
#               type        a canonically printed type (Stave surface spelling, e.g. `&mut [u8]`)
#               token-kinds a list of terminal names (KIND spelling of the tokens dump),
#                           in generated-table terminal order, joined by ", "
#               int         a decimal integer
#               place       a borrow place: local name, then `.field`, `[_]`, prefixed `*` per deref
#               source      the exact source bytes of a span
#               text-literal one of the strings listed for that hole in `choices`
#   choices   { hole = ["...", ...] } for text-literal holes
#   message   template, one line, no trailing period
#   labels    [{ at = "primary" | "<role>", text = template }]. A role names a related span the
#             compiler supplies; related spans print in the order of this list. A role may be
#             supplied several times (a call chain, a cycle): its label prints once per span, in
#             the order supplied. A label whose role is not supplied is not printed
#   fix       { description = template, applicability = "exact" | "maybe" | "placeholder",
#               edits = [{ at = "primary" | "<role>", replacement = template }] }
#             applicability: "exact" = applying the edits removes this diagnostic and changes no
#             other behavior (the only fixes `stave fix` applies); "maybe" = a likely fix to
#             review (the default for a fix with edits); "placeholder" = the edits or the
#             description hold text to fill in (always for a fix without edits). A diagnostic
#             whose edit roles the compiler does not supply carries no edits and is "placeholder".
#             An edit at a role may be an insertion: the compiler supplies a span of length 0
#   Codes whose rule ends "(planned)" are registered before the compiler emits them.
#   cases     optional { case-name = { message, labels, fix } } for a code with several shapes;
#             the compiler picks the case, keys not given in a case come from the entry (each key
#             is replaced whole: a case `fix` replaces the entry's description, applicability, and
#             edits)
# Template syntax: {hole} inserts a hole; {{ and }} are literal braces; backticks are literal.
# Style: types, code (names, paths, operators, source text, target and feature names), and flags
# are always in backticks in message, label, and fix text, e.g. "expected `{expected}`",
# "`--compiler gpu`: ...". Holes of kind text-literal whose choices are prose stay bare.
# Rendered message, label, and fix description text is one line. In those positions a `source`
# hole value is normalized: every run of whitespace (space, tab, LF, VT, FF, CR; newlines
# included) becomes one space, and leading and trailing whitespace is removed. Any other hole value
# with a newline there is a render error. Edit replacements take hole values unchanged (they may
# span lines).

[[diag]]
code = "E0001"
severity = "error"
area = "lex-parse"
rule = "source is not valid UTF-8"
message = "source is not valid UTF-8"
labels = [{ at = "primary", text = "invalid UTF-8 byte sequence starts here" }]
fix = { description = "re-encode the file as UTF-8 (without byte-order mark), or remove the invalid bytes" }

[[diag]]
code = "E0002"
severity = "error"
area = "lex-parse"
rule = "source file exceeds 4 GiB (u32 offsets); files up to that size are accepted"
holes = { size = "int" }
message = "source file is {size} bytes, over the 4 GiB limit"
labels = [{ at = "primary", text = "file too large" }]
fix = { description = "split the file into several modules, each smaller than 4 GiB" }

[[diag]]
code = "E0003"
severity = "error"
area = "lex-parse"
rule = "unterminated string, char, or f-string literal: it reaches end of file before its closing quote, with no newline in between (a raw newline first is E0015)"
holes = { what = "text-literal" }
choices = { what = ["string", "f-string", "char"] }
message = "unterminated {what} literal"
labels = [{ at = "primary", text = "{what} literal starts here and is never closed" }]
fix = { description = "add the closing quote of this {what} literal before the end of the file, on the same line" }

[[diag]]
code = "E0004"
severity = "error"
area = "lex-parse"
rule = "unexpected token (the message lists the expected set); only the first per item, the item is dropped"
holes = { found = "token-kinds", expected = "token-kinds" }
message = "unexpected {found}, expected one of: {expected}"
labels = [{ at = "primary", text = "unexpected {found}" }]
fix = { description = "write one of {expected} here, or remove {found}" }

[[diag]]
code = "E0005"
severity = "error"
area = "lex-parse"
rule = "bracket nesting depth over 10,000, at the first opener reaching depth 10,001; one per file, no other parse diagnostics for the file; E0016 takes precedence. Case `expr`: expressions, blocks, and patterns nested deeper than 20,000 levels (nesting without brackets, e.g. a run of unary operators), once per fn body, at the first node over the limit"
message = "brackets nested deeper than 10000 levels"
labels = [{ at = "primary", text = "this opener reaches nesting depth 10001" }]
fix = { description = "reduce the nesting: move inner expressions into local bindings, functions, or consts" }

[diag.cases.expr]
message = "expression nested deeper than 20000 levels"
labels = [{ at = "primary", text = "this node reaches nesting depth 20001" }]

[[diag]]
code = "E0006"
severity = "error"
area = "lex-parse"
rule = "f-string interpolation is not a name or field path"
holes = { hole = "source" }
message = "f-string hole `{{{hole}}}` is not a name or field path"
labels = [{ at = "primary", text = "only a name, `self`, or a field path may appear here" }]
fix = { description = "bind the value to a local first (`let v = {hole};`), then write `{{v}}` in the f-string" }

[[diag]]
code = "E0011"
severity = "error"
area = "lex-parse"
rule = "`<` after a cast type (rule D2); write `(x as T) < y`"
message = "`<` after a cast type opens type arguments"
labels = [{ at = "primary", text = "`<` here starts type arguments of the cast type" }]
fix = { description = "write `(x as T) < y`, or close the type arguments" }

[[diag]]
code = "E0012"
severity = "error"
area = "lex-parse"
rule = "chained comparison `a < b < c`"
message = "comparison operators cannot be chained"
labels = [{ at = "primary", text = "second comparison here" }]
fix = { description = "split the chain with `&&`: write `a < b && b < c`" }

[[diag]]
code = "E0013"
severity = "error"
area = "lex-parse"
rule = "`unsafe` without an obligation string, or with an empty one (`unsafe(\"\")`)"
message = "`unsafe` needs an obligation string"
labels = [{ at = "primary", text = "`unsafe` without `(\"...\")`" }]
fix = { description = "state why the code is sound: write `unsafe(\"<obligation>\")` before the block, expression, or item" }

[diag.cases.empty]
message = "`unsafe` has an empty obligation string"
labels = [{ at = "primary", text = "empty obligation" }]
fix = { description = "state why the code is sound in the string: `unsafe(\"<obligation>\")`" }

[[diag]]
code = "E0014"
severity = "error"
area = "lex-parse"
rule = "struct literal or struct pattern written `Name { ... }`; write `Name.{ ... }`"
holes = { path = "source" }
message = "struct literal or pattern after `{path}` needs `.{{`"
labels = [{ at = "primary", text = "`{{` here opens a block" }]
fix = { description = "write `{path}.{{ ... }}`", edits = [{ at = "primary", replacement = ".{{" }] }

[[diag]]
code = "E0015"
severity = "error"
area = "lex-parse"
rule = "raw newline inside a string, f-string, or char literal (before its closing quote; reported at the literal's start, the literal ends at the newline; end of file first is E0003); write `\\n`, the literal must end on its line"
holes = { what = "text-literal" }
choices = { what = ["string", "f-string", "char"] }
message = "raw newline inside a {what} literal"
labels = [{ at = "primary", text = "{what} literal starts here; the line ends before its closing quote" }]
fix = { description = "write `\\n` for the newline and close the {what} literal on this line" }

[[diag]]
code = "E0016"
severity = "error"
area = "lex-parse"
rule = "unbalanced brackets; one per file, no other parse diagnostics for the file"
holes = { closer = "token-kinds", opener = "token-kinds" }
message = "unbalanced brackets"
labels = [{ at = "primary", text = "unbalanced" }]
fix = { description = "balance the brackets of this file" }

[diag.cases.unmatched]
message = "unmatched closing {closer}"
labels = [{ at = "primary", text = "no opener for this {closer}" }]
fix = { description = "remove this {closer}, or add its opener before it" }

[diag.cases.mismatched]
message = "{closer} closes {opener}"
labels = [{ at = "primary", text = "{closer} here" }, { at = "opener", text = "{opener} opened here" }]
fix = { description = "close the inner {opener} first, or change this {closer}" }

[diag.cases.unclosed]
message = "{opener} is never closed"
labels = [{ at = "primary", text = "{opener} opened here, still open at end of file" }]
fix = { description = "add the closer of this {opener} before the end of the file" }

[[diag]]
code = "E0017"
severity = "error"
area = "lex-parse"
rule = "byte-order mark at file start; remove it (UTF-8 without BOM)"
message = "file starts with a byte-order mark"
labels = [{ at = "primary", text = "byte-order mark" }]
fix = { description = "remove the byte-order mark: save the file as UTF-8 without BOM", applicability = "exact", edits = [{ at = "primary", replacement = "" }] }

[[diag]]
code = "E0018"
severity = "error"
area = "lex-parse"
rule = "unexpected character: a byte that starts no token (`@ $ \\ #` backtick, a control byte other than tab/LF/CR, DEL) or any non-ASCII byte outside string, char, and f-string literals and comments (identifiers are ASCII); one per run of consecutive such bytes, at its start; the item is dropped without E0004"
message = "unexpected character"
labels = [{ at = "primary", text = "starts no token" }]
fix = { description = "remove it: identifiers are ASCII `[A-Za-z_][A-Za-z0-9_]*`, and other text belongs in a string literal or a comment" }

[[diag]]
code = "E0019"
severity = "error"
area = "lex-parse"
rule = "`if let` or `while let` (Rust): Stave has no `let` conditions; write a `match`"
holes = { kw = "text-literal" }
choices = { kw = ["if", "while"] }
message = "`{kw} let` is not Stave: use `match`"
labels = [{ at = "primary", text = "`{kw} let` here" }]
fix = { description = "write `match e {{ P => {{ .. }} _ => {{ }} }}` (`while let`: `loop {{ match e {{ P => {{ .. }} _ => {{ break; }} }} }}`)" }

[[diag]]
code = "E0020"
severity = "error"
area = "lex-parse"
rule = "`let P = e else { .. };` (Rust `let … else`): write a `match`"
message = "`let … else` is not Stave: use `match`"
labels = [{ at = "primary", text = "`else` after a `let` initializer" }]
fix = { description = "write `let x = match e {{ P(x) => x, _ => {{ .. }} }};` as a `match` statement whose other arm leaves the function" }

[[diag]]
code = "E0021"
severity = "error"
area = "lex-parse"
rule = "expression without `;` before `}` (a Rust tail expression): blocks are not values; return with `return e;`"
message = "blocks are not values: write `return` and `;`"
labels = [{ at = "primary", text = "tail expression" }]
fix = { description = "write `return e;` to return the value, or end the statement with `;`" }

[[diag]]
code = "E0022"
severity = "error"
area = "lex-parse"
rule = "`where` clause (Rust): bounds are written inline only, `<T: A + B>`"
message = "`where` clauses are not Stave: write the bounds inline"
labels = [{ at = "primary", text = "`where` here" }]
fix = { description = "move each bound into the generic parameter list: `fn f<T: A + B>(..)`" }

[[diag]]
code = "E0023"
severity = "error"
area = "lex-parse"
rule = "`::` as a path separator (Rust `a::b`): `.` is the only path separator; `::` only before generic args"
message = "`::` is not a path separator: write `.`"
labels = [{ at = "primary", text = "`::` in a path" }]
fix = { description = "replace `::` with `.`", applicability = "exact", edits = [{ at = "primary", replacement = "." }] }

[[diag]]
code = "E0024"
severity = "error"
area = "lex-parse"
rule = "lifetime `'a` (a `'` followed by an identifier and no closing `'`): Stave has no lifetimes; a lexical error, one per occurrence"
holes = { text = "source" }
message = "lifetime `{text}` is not Stave: references have no lifetimes"
labels = [{ at = "primary", text = "lifetime here" }]
fix = { description = "remove `{text}`; name a returned borrow's origin with `-> &T from x`", edits = [{ at = "primary", replacement = "" }] }

[diag.cases.ref]
fix = { description = "remove `{text}`; name a returned borrow's origin with `-> &T from x`", applicability = "exact", edits = [{ at = "cut", replacement = "" }] }

[[diag]]
code = "E0025"
severity = "error"
area = "lex-parse"
rule = "`mut x: T` parameter (Rust): params are immutable bindings; rebind with `let mut` in the body"
message = "`mut` parameters are not Stave"
labels = [{ at = "primary", text = "`mut` before a parameter name" }]
fix = { description = "remove `mut` and write `let mut y = x;` at the start of the body" }

[[diag]]
code = "E0026"
severity = "error"
area = "lex-parse"
rule = "tuple struct `struct S(T);` or unit struct `struct S;` (Rust): structs have named fields, `struct S { v: T }`, `struct S {}`"
holes = { name = "name" }
message = "struct `{name}` needs named fields in `{{ }}`"
labels = [{ at = "primary", text = "tuple or unit struct" }]
fix = { description = "declare named fields: `struct {name} {{ v: T }}` (a unit struct is `struct {name} {{}}`)" }

[diag.cases.unit]
message = "unit struct `{name}` is written `struct {name} {{}}`"
labels = [{ at = "primary", text = "unit struct" }]
fix = { description = "replace `;` with `{{}}`", applicability = "exact", edits = [{ at = "primary", replacement = " {{}}" }] }

[[diag]]
code = "E0027"
severity = "error"
area = "lex-parse"
rule = "`!` as a type (Rust never type): write `never`, only after `->`"
message = "`!` is not a type: write `never`"
labels = [{ at = "primary", text = "`!` in a type position" }]
fix = { description = "replace `!` with `never`", edits = [{ at = "primary", replacement = "never" }] }

[diag.cases.ret]
fix = { description = "replace `!` with `never`", applicability = "exact", edits = [{ at = "primary", replacement = "never" }] }

[[diag]]
code = "E0028"
severity = "error"
area = "lex-parse"
rule = "`dyn Trait` or `impl Trait` in a type position (Rust): use a generic `<T: Trait>` or a fn type"
holes = { kw = "text-literal" }
choices = { kw = ["dyn", "impl"] }
message = "`{kw} Trait` types are not Stave: use a generic parameter"
labels = [{ at = "primary", text = "`{kw}` in a type position" }]
fix = { description = "add a generic parameter `<T: Trait>` and write `T`, or use a fn type `fn(..) -> R`" }

[[diag]]
code = "E0029"
severity = "error"
area = "lex-parse"
rule = "block comment `/*` (Rust/C): Stave has `//` line comments only; the token `/*` is a lexical error through the end of its line or the first `*/` on it (`a / *p` needs the space)"
message = "block comments are not Stave: use `//`"
labels = [{ at = "primary", text = "`/*` here" }]
fix = { description = "start each comment line with `//`" }

[[diag]]
code = "E0101"
severity = "error"
area = "resolve"
rule = "unresolved name"
holes = { name = "name" }
message = "cannot find `{name}` in this scope"
labels = [{ at = "primary", text = "not found" }]
fix = { description = "declare `{name}`, import the module that defines it, or correct the spelling" }

[diag.cases.not-type]
message = "`{name}` is not a type"
labels = [{ at = "primary", text = "expected a type here" }]
fix = { description = "name a struct, enum, type alias, generic parameter, or built-in type" }

[diag.cases.not-trait]
message = "`{name}` is not a trait"
labels = [{ at = "primary", text = "expected a trait here" }]
fix = { description = "name a trait in the bound or after `impl`" }

[[diag]]
code = "E0102"
severity = "error"
area = "resolve"
rule = "import cycle; one per strongly connected component, listed from its lexicographically smallest module path, following import order"
holes = { module = "path" }
message = "import cycle through module `{module}`"
labels = [{ at = "primary", text = "`{module}` starts the cycle here" }, { at = "import", text = "next import of the cycle" }]
fix = { description = "break the cycle: move the shared items into a module that none of these modules import" }

[[diag]]
code = "E0103"
severity = "error"
area = "resolve"
rule = "unqualified enum variant in a pattern or expression"
holes = { name = "name", enum = "path" }
message = "enum variant `{name}` must be qualified as `{enum}.{name}`"
labels = [{ at = "primary", text = "unqualified variant" }]
fix = { description = "write `{enum}.{name}`", edits = [{ at = "primary", replacement = "{enum}.{name}" }] }

[[diag]]
code = "E0104"
severity = "error"
area = "resolve"
rule = "more than one `allocator` declaration in a binary"
message = "more than one `allocator` declaration in this binary"
labels = [{ at = "primary", text = "another `allocator` declaration" }, { at = "first", text = "first `allocator` declaration here" }]
fix = { description = "keep one `allocator` declaration in the binary and remove the others" }

[[diag]]
code = "E0105"
severity = "error"
area = "resolve"
rule = "duplicate declaration of `<name>` in `<scope>` (also a name bound twice by one pattern); reported at each later declaration, related span: the first declaration"
holes = { name = "name", scope = "path" }
message = "duplicate declaration of `{name}` in `{scope}`"
labels = [{ at = "primary", text = "`{name}` declared again here" }, { at = "first", text = "first declaration of `{name}`" }]
fix = { description = "rename this `{name}`, or remove one of the two declarations" }

[[diag]]
code = "E0106"
severity = "error"
area = "resolve"
rule = "item, field, or method used outside its module without `pub` (everything is private to its module unless `pub`; trait impl methods have the trait's visibility)"
holes = { name = "name", module = "path" }
message = "`{name}` is private to module `{module}`"
labels = [{ at = "primary", text = "private `{name}` used here" }, { at = "decl", text = "`{name}` declared here without `pub`" }]
fix = { description = "mark `{name}` `pub` in `{module}`, or use it only inside `{module}`" }

[diag.cases.column]
message = "column `{name}` is private to module `{module}`: its field of the row struct is not `pub`"
labels = [{ at = "primary", text = "private column `{name}` used here" }, { at = "decl", text = "field `{name}` declared here without `pub`" }]
fix = { description = "mark field `{name}` `pub` in `{module}`, or use the column only inside `{module}`" }

[[diag]]
code = "E0107"
severity = "error"
area = "resolve"
rule = "import path is ambiguous: its first segment is both a dependency of the package and a module (or module directory) of the package"
holes = { name = "name", package = "name" }
message = "import path is ambiguous between dependency `{name}` and module `{name}`"
labels = [{ at = "primary", text = "`{name}` names a dependency and a module of `{package}`" }]
fix = { description = "for the module, start the path with the package's own name: `import {package}.{name}` (add `as` to pick the bound name); for the dependency, rename the module `{name}` or rename the dependency in `stave.toml`" }

[[diag]]
code = "E0108"
severity = "error"
area = "resolve"
rule = "a `bin` package (or single-file program) has no `fn main` in its root module; builds only, at offset 0 of the root module, only when there is no other error"
message = "the program has no `fn main` in its root module"
labels = [{ at = "primary", text = "root module without `fn main`" }]
fix = { description = "add `fn main() -> i32 {{ return 0; }}` to the root module, or set `kind = \"lib\"` in `stave.toml` for a library" }

[[diag]]
code = "E0201"
severity = "error"
area = "types"
rule = "mismatched types, with no implicit conversion"
holes = { expected = "type", found = "type", operand = "source", count = "int", given = "int" }
message = "mismatched types: expected `{expected}`, found `{found}`"
labels = [{ at = "primary", text = "this is `{found}`" }, { at = "expected", text = "`{expected}` required by this" }]
fix = { description = "convert explicitly: `{operand} as {expected}` (or `as%`, `as|`, `as?`, `as~` when lossy)", edits = [{ at = "primary", replacement = "{operand} as {expected}" }] }

[diag.cases.type-args]
message = "`{operand}` takes {count} generic arguments, found {given}"
labels = [{ at = "primary", text = "wrong number of generic arguments" }]
fix = { description = "give exactly {count} generic arguments" }

[diag.cases.const-arg]
message = "`{operand}` is not a const generic argument"
labels = [{ at = "primary", text = "expected an int literal, a const, or `{{ const-expr }}`" }]
fix = { description = "pass a const-expr, braced when it is not a literal or a name: `{{N + 1}}`" }

[diag.cases.arity]
message = "`{operand}` takes {count} arguments, found {given}"
labels = [{ at = "primary", text = "wrong number of arguments" }]
fix = { description = "pass exactly {count} arguments" }

[diag.cases.not-value]
message = "`{operand}` is not a value"
labels = [{ at = "primary", text = "a module, type, or trait used as a value" }]
fix = { description = "use a value here: a local, a const, a fn, or a variant" }

[diag.cases.not-callable]
message = "`{operand}` of type `{found}` cannot be called"
labels = [{ at = "primary", text = "not a fn" }]
fix = { description = "call a fn item, a method, a variant constructor, or a value of fn type" }

[diag.cases.not-in-loop]
message = "`{operand}` outside of a loop"
labels = [{ at = "primary", text = "no enclosing `loop`, `while`, or `for`" }]
fix = { description = "use `{operand}` only inside a loop body; to leave a fn, use `return`" }

[[diag]]
code = "E0202"
severity = "error"
area = "types"
rule = "literal has no type context (no default type); add a suffix or an annotation"
holes = { literal = "source" }
message = "literal `{literal}` has no type context"
labels = [{ at = "primary", text = "type of this literal is unknown" }]
fix = { description = "add a type suffix (`{literal}i32`) or annotate the binding (`let x: i32 = {literal};`)" }

[diag.cases.float]
fix = { description = "add a type suffix (`{literal}f64`) or annotate the binding (`let x: f64 = {literal};`)" }

[diag.cases.infer]
message = "the generic arguments of `{literal}` cannot be inferred"
labels = [{ at = "primary", text = "generic arguments unknown" }]
fix = { description = "give them with `::<..>` or annotate the binding: `let x: Option<u32> = {literal};`" }

[[diag]]
code = "E0203"
severity = "error"
area = "types"
rule = "literal out of range for its type"
holes = { literal = "source", type = "type", min = "int", max = "int" }
