[workspace]
resolver = "3"
members = [
    "crates/stave-diag", "crates/stave-syntax", "crates/stave-intern", "crates/stave-sema", "crates/stave-borrow",
    "crates/stave-target", "crates/stave-ir", "crates/stave-opt", "crates/stave-codegen-x64", "crates/stave-codegen-a64",
    "crates/stave-obj", "crates/stave-driver", "crates/stave-cli",
    "tools/ll1gen", "tools/diaggen", "tools/gen-tables", "tools/gen-corpus", "tools/touch-fn",
    "tools/lang-budget", "tools/fuzz-classes",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stave-lang/stave"
homepage = "https://stave-lang.org"
publish = false

[workspace.dependencies]
# compiler
memmap2 = "0.9"
rustc-hash = "2.1"
rayon = "1.12"
# tools and tests only, never linked into the compiler
toml = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1.12"
# workspace crates
stave-diag = { path = "crates/stave-diag" }
stave-syntax = { path = "crates/stave-syntax" }
stave-intern = { path = "crates/stave-intern" }
stave-sema = { path = "crates/stave-sema" }
stave-borrow = { path = "crates/stave-borrow" }
stave-target = { path = "crates/stave-target" }
stave-ir = { path = "crates/stave-ir" }
stave-opt = { path = "crates/stave-opt" }
stave-codegen-x64 = { path = "crates/stave-codegen-x64" }
stave-codegen-a64 = { path = "crates/stave-codegen-a64" }
stave-obj = { path = "crates/stave-obj" }
stave-driver = { path = "crates/stave-driver" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The reference interpreter runs most of the test suite's time; optimizing it costs seconds of
# build. Debug assertions and overflow checks stay on (opt-level does not change them).
[profile.dev.package.stave-ir]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
