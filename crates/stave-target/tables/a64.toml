# checked add/sub/mul: the result, an any-lane overflow test, the Option (tag select and payload mask:
# the last five instructions)

[[op]]
op = "vec.checked_add"
ty = ["int"]
neon = { class = "M", recipe = "add; ?qadd; cmeq; mvn; umov x2; orr; cmp; csel; csetm; dup; and", note = "a lane overflows where the saturating result differs from the wrapping one" }
sve = { class = "M", recipe = "add; ?qadd; cmpne; cset" }

[[op]]
op = "vec.checked_sub"
ty = ["int"]
neon = { class = "M", recipe = "sub; ?qsub; cmeq; mvn; umov x2; orr; cmp; csel; csetm; dup; and", note = "a lane overflows where the saturating result differs from the wrapping one" }
sve = { class = "M", recipe = "sub; ?qsub; cmpne; cset" }

[[op]]
op = "vec.checked_mul"
ty = ["i8", "i16", "i32"]
neon = { class = "M", recipe = "smull; xtn; sxtl; cmeq; smull2; xtn2; sxtl2; cmeq; and; mvn; umov x2; orr; cmp; csel; csetm; dup; and", note = "a lane overflows where the double-width product differs from the truncated one extended back" }
sve = { class = "M", recipe = "mul; smulh; asr; cmpne; cset" }

[[op]]
op = "vec.checked_mul"
ty = ["u8", "u16", "u32"]
neon = { class = "M", recipe = "umull; xtn; uxtl; cmeq; umull2; xtn2; uxtl2; cmeq; and; mvn; umov x2; orr; cmp; csel; csetm; dup; and", note = "a lane overflows where the double-width product differs from the truncated one extended back" }
sve = { class = "M", recipe = "mul; umulh; cmpne; cset" }

[[op]]
op = "vec.checked_mul"
ty = ["i64"]
neon = { class = "M", recipe = "umov x4; mul x2; smulh x2; cmp x2; cset x2; orr x2; ins x2; cmp; csel; csetm; dup; and", note = "per lane through general registers" }
sve = { class = "M", recipe = "mul; smulh; asr; cmpne; cset" }

[[op]]
op = "vec.checked_mul"
ty = ["u64"]
neon = { class = "M", recipe = "umov x4; mul x2; umulh x2; cmp x2; cset x2; orr x2; ins x2; cmp; csel; csetm; dup; and", note = "per lane through general registers" }
