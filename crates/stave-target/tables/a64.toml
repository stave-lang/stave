ty = ["int64"]
neon = { class = "M", recipe = "umov x4; ?mulh x2; ins x2", note = "no 64-bit lane high multiply: per lane through general registers" }
sve = { class = "N", recipe = "?mulh" }

# the exact double-width products narrowed with saturation; 64-bit lanes per lane through general
# registers

[[op]]
op = "vec.mul.sat"
ty = ["i8", "i16", "i32"]
neon = { class = "M", recipe = "?mull; ?qxtn; ?mull2; ?qxtn2" }
sve = { class = "M", recipe = "mul; smulh; asr; eor; asr; eor; cmpne; sel", unverified = true }

[[op]]
