# AArch64 lowering table (contracts/simd-ops.md: classes, operation table, chunk loops, memory hints).
# tools/gen-tables turns it into src/generated/a64.rs.
#
# Tiers: neon = baseline AdvSIMD, 128-bit; sve = SVE (also the sve2 target), scalable, ops under a
# governing predicate (an all-true ptrue, hoisted). On neon a mask is a vector of all-ones lanes,
# on sve a predicate register. An sve recipe marked "NEON" covers fixed 128-bit vectors only.
#
# Schema, placeholders and counting rules: as in x86.toml. Here `*` is the SVE size letter
# (b h w d), `?` s or u, `#` bits. A per-lane sequence lists each instruction with its count over
# the lanes (`umov x4`); the work-area address and the zeroing of a result are not counted. Recipes
# of the neon tier are what the backend emits.

# float add/sub/mul/div

[[op]]
op = "vec.add"
ty = ["float"]
neon = { class = "N", recipe = "fadd" }
sve = { class = "N", recipe = "fadd" }

[[op]]
op = "vec.sub"
ty = ["float"]
neon = { class = "N", recipe = "fsub" }
sve = { class = "N", recipe = "fsub" }

[[op]]
op = "vec.mul"
ty = ["float"]
neon = { class = "N", recipe = "fmul" }
sve = { class = "N", recipe = "fmul" }

[[op]]
op = "vec.div"
ty = ["float"]
neon = { class = "N", recipe = "fdiv" }
sve = { class = "N", recipe = "fdiv" }

