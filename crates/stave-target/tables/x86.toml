# masked load and store without a masked-move instruction (8/16-bit lanes at v2 and v3, every width at v2): a
# load zeroes the result home and copies the active lanes in; a store of up to 8 lanes stores every lane (an
# inactive one back to its own bytes), a longer one loops over the set mask bits

[[op]]
op = "vec.load_masked"
ty = ["int32"]
v2 = { class = "M", recipe = "mov x6; cmp x4; je x4; movx x4", note = "copies the active lanes into a zeroed home" }
v3 = { class = "N", recipe = "vpmaskmov*" }
v4 = { class = "N", recipe = "vmovdqu# {k}{z}" }

