# x86-64 lowering table (contracts/simd-ops.md: classes, operation table, chunk loops, memory hints).
# tools/gen-tables turns it into src/generated/x86.rs.
#
# Tiers: v2 = SSE4.2, 128-bit; v3 = AVX2 FMA BMI2 F16C, 256-bit VEX; v4 = v3 + AVX-512 F BW VL DQ
# CD, 512-bit EVEX with masks in k registers. On v2 and v3 a mask is a vector of all-ones lanes.
#
# One [[op]] per (op, type class, form):
#   op    the IR name (`vec.*`, `mask.*`); chunk-loop constructs are `loop.*`, memory hints and
#         ops without an IR op yet are `mem.*` / `vec.*` by their method name.
#   ty    lane types i8 i16 i32 i64 u8 u16 u32 u64 f16 bf16 f32 f64; groups intW (iW and uW), anyW
#         (every lane type of W bits), int sint uint float any; masks m8 m16 m32 m64 or mask;
#         casts S>D.
#   form  for shifts: the amount, `const` or `vector`.
# Per tier `{ class, recipe, note, unverified }`: class N, M or U; no recipe for U. A key
# `tier+feature` is the cell with that feature on top of the tier baseline.
#
# Recipe: the instructions for one vector of the tier's full width, "; " separated; "xK" repeats
# one K times (a long repeated group may be listed as its instruction counts); "none" is no
# instruction. Placeholders take the lane type (for a cast, the integer side; `%` the float side):
# `*` size letter b w d q, `#` bits, `%` float letter s d, `?` s or u. Not listed: register
# copies, loop-invariant constants (memory operands or hoisted), loop control, and the trap checks
# an op implies (bounds, shift amount, divisor). An op whose sequence depends on a constant
# (div_const, permute) lists the worst case. The cost is the number of instructions in the recipe,
# a loop body counted once.

# float add/sub/mul/div

[[op]]
op = "vec.add"
ty = ["float"]
v2 = { class = "N", recipe = "addp%" }
v3 = { class = "N", recipe = "vaddp%" }
v4 = { class = "N", recipe = "vaddp%" }

[[op]]
op = "vec.sub"
