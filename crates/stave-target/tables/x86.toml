v2 = { class = "N", recipe = "pslldq; padd*", note = "log steps of a byte shift and an add" }
v3 = { class = "M", recipe = "vpslldq; vpadd*; vpsrldq; vpbroadcast*; vinserti128; vpadd*", note = "log steps within each 128-bit half, then the total of the lower half added to the upper" }
