ty = ["any32"]
v2 = { class = "U" }
v3 = { class = "M", recipe = "vextracti128; vpmovzxdq x2; vpcmpeqd x2; vpgatherqd x2; vinserti128", note = "32-bit indices into a slice go through 64-bit indices, two gathers of four; a fixed-length array of at most 2^31 elements takes them directly: vpcmpeqd; vpgatherdd (N)" }
v4 = { class = "N", recipe = "kxnorw; vpgatherdd", note = "an index of 2^31 or more needs 64-bit indices (vpgatherqd, two gathers)" }

