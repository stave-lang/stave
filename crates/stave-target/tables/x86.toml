ty = ["any8", "any16"]
v2 = { class = "N", recipe = "movd; pshufb" }
v3 = { class = "N", recipe = "vmovd; vpbroadcast*" }
v4 = { class = "N", recipe = "vpbroadcast*" }

[[op]]
op = "vec.splat"
ty = ["int32"]
v2 = { class = "N", recipe = "movd; pshufd" }
v3 = { class = "N", recipe = "vmovd; vpbroadcastd" }
v4 = { class = "N", recipe = "vpbroadcastd" }

[[op]]
op = "vec.splat"
ty = ["int64"]
v2 = { class = "N", recipe = "movq; punpcklqdq" }
v3 = { class = "N", recipe = "vmovq; vpbroadcastq" }
v4 = { class = "N", recipe = "vpbroadcastq" }

[[op]]
op = "vec.splat"
ty = ["f32"]
v2 = { class = "N", recipe = "shufps" }
v3 = { class = "N", recipe = "vbroadcastss" }
v4 = { class = "N", recipe = "vbroadcastss" }

[[op]]
op = "vec.splat"
ty = ["f64"]
v2 = { class = "N", recipe = "movddup" }
v3 = { class = "N", recipe = "vbroadcastsd" }
v4 = { class = "N", recipe = "vbroadcastsd" }

[[op]]
op = "vec.bitcast"
ty = ["any"]
v2 = { class = "N", recipe = "none" }
v3 = { class = "N", recipe = "none" }
v4 = { class = "N", recipe = "none" }

[[op]]
op = "vec.split"
ty = ["any"]
v2 = { class = "N", recipe = "pshufd" }
v3 = { class = "N", recipe = "vextracti128" }
v4 = { class = "N", recipe = "vextracti64x4" }

[[op]]
op = "vec.join"
ty = ["any"]
v2 = { class = "N", recipe = "punpcklqdq" }
v3 = { class = "N", recipe = "vinserti128" }
v4 = { class = "N", recipe = "vinserti64x4" }

[[op]]
op = "mask.first_n"
ty = ["mask"]
v2 = { class = "M", recipe = "cmp; cmova; neg; movdqu" }
v3 = { class = "M", recipe = "cmp; cmova; neg; vmovdqu" }
v4 = { class = "N", recipe = "cmp; cmova; bzhi; kmovq", note = "k is clamped to the lane count first" }

# chunk loops and tails

[[op]]
op = "loop.chunk"
ty = ["any"]
v2 = { class = "N", recipe = "movdqu" }
v3 = { class = "N", recipe = "vmovdqu" }
v4 = { class = "N", recipe = "vmovdqu64" }

[[op]]
op = "loop.tail_masked"
ty = ["any32", "any64"]
v2 = { class = "M", recipe = "movdqa; mov; lea x2; rep movsb; movdqa; neg; movdqu" }
v3 = { class = "N", recipe = "neg; vmovdqu; vpmaskmov*" }
v4 = { class = "N", recipe = "bzhi; kmovq; vmovdqu# {k}{z}" }

[[op]]
op = "loop.tail_masked"
ty = ["any8", "any16"]
v2 = { class = "M", recipe = "movdqa; mov; lea x2; rep movsb; movdqa; neg; movdqu" }
v3 = { class = "M", recipe = "vmovdqa; mov; lea x2; rep movsb; vmovdqa; neg; vmovdqu" }
v4 = { class = "N", recipe = "bzhi; kmovq; vmovdqu# {k}{z}" }

[[op]]
op = "loop.tail_masked_mut"
ty = ["any32", "any64"]
v2 = { class = "M", recipe = "movdqa; mov; lea x2; rep movsb" }
v3 = { class = "N", recipe = "vpmaskmov*" }
v4 = { class = "N", recipe = "vmovdqu# {k}" }

[[op]]
op = "loop.tail_masked_mut"
ty = ["any8", "any16"]
v2 = { class = "M", recipe = "movdqa; mov; lea x2; rep movsb" }
v3 = { class = "M", recipe = "vmovdqa; mov; lea x2; rep movsb" }
v4 = { class = "N", recipe = "vmovdqu# {k}" }

[[op]]
op = "loop.tail_scalar"
ty = ["any"]
v2 = { class = "N", recipe = "none" }
v3 = { class = "N", recipe = "none" }
v4 = { class = "N", recipe = "none" }

[[op]]
op = "loop.tail_exact"
ty = ["any"]
v2 = { class = "N", recipe = "test; jnz" }
v3 = { class = "N", recipe = "test; jnz" }
v4 = { class = "N", recipe = "test; jnz" }

