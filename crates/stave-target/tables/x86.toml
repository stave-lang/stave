# permute, lookup

[[op]]
op = "vec.permute"
ty = ["any8"]
v2 = { class = "N", recipe = "pshufb" }
v3 = { class = "M", recipe = "vpermq; vpshufb x2; vpor", note = "worst case, a lane crosses the 128-bit halves: the operand and its halves swapped are shuffled and or-ed; otherwise one or two instructions" }
v4 = { class = "M", recipe = "vpermi2w x2; vpshufb x2; vporq", note = "vpermb needs avx512vbmi: the word of each byte, then the byte in it" }
"v4+avx512vbmi" = { class = "N", recipe = "vpermb" }

[[op]]
op = "vec.permute"
ty = ["any16"]
v2 = { class = "N", recipe = "pshufb" }
v3 = { class = "M", recipe = "vpermq; vpshufb x2; vpor", note = "worst case, a lane crosses the 128-bit halves: the operand and its halves swapped are shuffled and or-ed; otherwise one or two instructions" }
v4 = { class = "N", recipe = "vpermi2w" }

[[op]]
op = "vec.permute"
ty = ["any32"]
v2 = { class = "N", recipe = "pshufb", note = "a byte shuffle with a constant control" }
v3 = { class = "N", recipe = "vpermd", note = "one cross-lane instruction" }
v4 = { class = "N", recipe = "vpermi2d" }

[[op]]
op = "vec.permute"
ty = ["any64"]
v2 = { class = "N", recipe = "pshufb", note = "a byte shuffle with a constant control" }
v3 = { class = "N", recipe = "vpermd", note = "one cross-lane instruction, on pairs of dword indices" }
v4 = { class = "N", recipe = "vpermi2q" }

[[op]]
op = "vec.lookup"
ty = ["int8"]
v2 = { class = "N", recipe = "paddusb; pshufb" }
v3 = { class = "M", recipe = "vpermq x2; vpxor; vpaddusb x2; vpshufb x2; vpor", note = "the table is looked up half by half, the upper half with bit 4 of the indices flipped" }
v4 = { class = "M", recipe = "vpaddusb; vshufi64x2 x4; vpshufb x4; vpsllw x2; vpmovb2m x2; vpblendmb x3" }
"v4+avx512vbmi" = { class = "N", recipe = "vpcmpub; vpermb {z}" }

[[op]]
op = "vec.lookup"
ty = ["int16"]
v2 = { class = "M", recipe = "movx x16; xor x8; cmp x8; jae x8; mov x8" }
v3 = { class = "M", recipe = "movx x32; xor x16; cmp x16; jae x16; mov x16" }
v4 = { class = "N", recipe = "vpcmpu*; vpermi2* {k}{z}" }

[[op]]
op = "vec.lookup"
ty = ["int32"]
v2 = { class = "M", recipe = "movx x8; xor x4; cmp x4; jae x4; mov x4" }
v3 = { class = "M", recipe = "movx x16; xor x8; cmp x8; jae x8; mov x8" }
v4 = { class = "N", recipe = "vpcmpu*; vpermi2* {k}{z}" }

[[op]]
op = "vec.lookup"
ty = ["int64"]
v2 = { class = "M", recipe = "mov x6; xor x2; cmp x2; jae x2" }
v3 = { class = "M", recipe = "mov x12; xor x4; cmp x4; jae x4" }
v4 = { class = "N", recipe = "vpcmpu*; vpermi2* {k}{z}" }

