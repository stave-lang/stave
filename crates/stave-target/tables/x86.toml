# prefix scan add: floats lane by lane from lane 0, ints by log steps (wrapping, order-free)

[[op]]
op = "vec.scan_add"
ty = ["f32"]
v2 = { class = "M", recipe = "movss x5; addss x3", note = "lane by lane in order, the running sum in a register" }
v3 = { class = "M", recipe = "vmovss x9; vaddss x7", note = "lane by lane in order, the running sum in a register" }
v4 = { class = "M", recipe = "vmovss x17; vaddss x15", note = "lane by lane: each sum adds one lane to the one before" }

[[op]]
op = "vec.scan_add"
ty = ["f64"]
v2 = { class = "M", recipe = "movsd x3; addsd", note = "lane by lane in order, the running sum in a register" }
v3 = { class = "M", recipe = "vmovsd x5; vaddsd x3", note = "lane by lane in order, the running sum in a register" }
v4 = { class = "M", recipe = "vmovsd x9; vaddsd x7", note = "lane by lane: each sum adds one lane to the one before" }

[[op]]
op = "vec.scan_add_wrap"
ty = ["int8"]
v2 = { class = "M", recipe = "pslldq; padd*; pslldq; padd*; pslldq; padd*; pslldq; padd*", note = "log steps of a byte shift and an add" }
v3 = { class = "M", recipe = "vpslldq; vpadd*; vpslldq; vpadd*; vpslldq; vpadd*; vpslldq; vpadd*; vpsrldq; vpbroadcast*; vinserti128; vpadd*", note = "log steps within each 128-bit half, then the total of the lower half added to the upper" }
v4 = { class = "M", recipe = "vpslldq x4; vpaddb x7; vpshufb; valignq x3" }

[[op]]
op = "vec.scan_add_wrap"
ty = ["int16"]
v2 = { class = "M", recipe = "pslldq; padd*; pslldq; padd*; pslldq; padd*", note = "log steps of a byte shift and an add" }
v3 = { class = "M", recipe = "vpslldq; vpadd*; vpslldq; vpadd*; vpslldq; vpadd*; vpsrldq; vpbroadcast*; vinserti128; vpadd*", note = "log steps within each 128-bit half, then the total of the lower half added to the upper" }
v4 = { class = "M", recipe = "vpslldq x3; vpaddw x6; vpshufb; valignq x3" }

[[op]]
