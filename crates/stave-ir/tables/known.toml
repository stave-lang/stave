# The compiler-known items (contracts/intrinsics.md "Paths fixed by the compiler", the lang types
# and traits): the one table of their paths. `tools/gen-tables` writes stave-ir's `Known` enum from
# it (`crates/stave-ir/src/generated/known_items.rs`) and stage1's table
# (`stage1/ir/src/generated/known_items.stv`).
#
# One `[[item]]` per item, in `Known` order: `variant` (the Rust variant), `module`, `name`, and
# `method` for a method of the item `name`. `report = true`: a panic report entry (it runs on the
# alternate signal stack). `params` and `ret`: the signature of an item the stages call with an
# argument list of their own (absent: none), each a type of `usize isize u32 u64 unit u32x4
# mut_ptr_u8 const_ptr_u8 const_ptr_usize`. `inline = true`: the release optimizer inlines the
# item like an ordinary fn (contracts/opt-passes.md rule F8); it never inlines any other known
# item. An item with `ret` or `report` is never `inline`.

