# The intrinsic table (contracts/intrinsics.md): every name an `extern "stave-intrinsic"` block may
# declare, the arch it is built for, and its signature. `tools/gen-tables` writes stave-ir's table
# (`crates/stave-ir/src/generated/intrinsic_table.rs`, read by `intrinsics.rs`: the front end's
# E0805 / E0704 checks and the IR verifier) and stage1's (`stage1/ir/src/generated/intrinsic_table.stv`).
#
# One `[[intrinsic]]` per name: `name`, `kind` (the stave-ir `Kind` it parses to), `arch` (`x86`,
# `a64`, or `both`), and `params` and `ret` (types as in known.toml); a name without them has no
# checked signature (`static_addr`, which lowering alone emits: its result type is the module's).
# `[ptx]`: the PTX set, which has no checked signature: the `names`, and every name that starts
# with one of `prefixes` and ends with one of `suffixes`.

[[intrinsic]]
name = "syscall0"
kind = "Syscall(0)"
arch = "both"
params = ["usize"]
ret = "isize"

