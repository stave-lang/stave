name: fuzz
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "first seed (default: the run number times 100000)"
        required: false
      budget:
        description: seconds of fuzzing
        required: false
        default: "600"
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fuzz-classes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "1"
      # The release profile's fat LTO costs minutes of build time and nothing a fuzz run needs.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # The interpreter leg runs in checking mode with borrow tracking: a memory error or a
      # borrow violation of an accepted program is an `oracle` finding.
      STAVE_INTERP_CHECK: borrow
      # Every body is checked by both dataflows of the borrow checker: a difference is an `ice`
      # finding.
      STAVE_BORROW_DATAFLOW: both
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked --release -p fuzz-classes
      # A new first seed per run: the runs together cover new programs, and a finding names its
      # seed, so `fuzz-classes --print --class C --seed N` reproduces it.
      - run: >
          target/release/fuzz-classes
          --seed "${{ github.event.inputs.seed || format('{0}00000', github.run_number) }}"
          --time-budget "${{ github.event.inputs.budget || '600' }}"
          --jobs "$(nproc)" --release --out fuzz-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-classes-${{ github.run_number }}
          path: |
            fuzz-out/findings/
            fuzz-out/summary.txt
            fuzz-out/programs.tsv
          if-no-files-found: ignore
  # The borrow checker's two dataflows on every program of the repository, a generated corpus
  # and the fuzz classes: identical diagnostics.
  borrow-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/ci-step/run.sh borrow-diff
  # The interpreter gate of `check` with the programs too slow for it (debug build).
  interp-gate-slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/ci-step/run.sh interp-gate-slow
