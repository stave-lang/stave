name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "1"
  # A native test leg that cannot run here (CPU feature, qemu-aarch64) fails instead of skipping.
  STAVE_REQUIRE_LEGS: v2,v3,aarch64
jobs:
  # A pull request that changes only *.md files skips the build and test jobs. Any other diff,
  # a push, an empty diff, or a diff that cannot be computed runs everything.
  # LANG.md and contracts/ are read by tests and generators, so they count as code.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git fetch --no-tags --depth=1 origin "$BASE" &&
            files=$(git -c core.quotepath=off diff --name-only --no-renames "$BASE" HEAD) &&
            [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '\.md$' &&
            ! printf '%s\n' "$files" | grep -qE '^(LANG\.md$|contracts/)'; then
            echo docs_only=true >> "$GITHUB_OUTPUT"
          fi
  # The parts of `run.sh check` run side by side: one after another they are longer than a job
  # may take on a slow runner. The matrices of `test` and `gates` together list every part, and
  # the shards of one step list every K of the same N. A failing leg does not cancel the others.
  test:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      # AArch64 programs built by the tests run under user-mode emulation.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user binutils-aarch64-linux-gnu
      - run: sh tools/ci-step/run.sh check-test ${{ matrix.shard }}
  gates:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        step: [check-gates-rest, stage1-ir-gate 1/2, stage1-ir-gate 2/2]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user binutils-aarch64-linux-gnu
      - run: sh tools/ci-step/run.sh ${{ matrix.step }}
  # The required status check is this job: it runs on every event and succeeds only when the
  # scope is known and every leg either passed or was left out for a markdown-only diff. The
  # result of a matrix job is `success` only when each of its legs succeeded.
  check:
    needs: [scope, test, gates]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          TEST: ${{ needs.test.result }}
          GATES: ${{ needs.gates.result }}
        run: |
          echo "scope=$SCOPE docs_only=$DOCS_ONLY test=$TEST gates=$GATES"
          [ "$SCOPE" = success ] || exit 1
          if [ "$DOCS_ONLY" = true ]; then
            [ "$TEST" = skipped ] && [ "$GATES" = skipped ]
          else
            [ "$TEST" = success ] && [ "$GATES" = success ]
          fi
